# KDSE Runtime Configuration

runtime:
  # Execution mode: standard, minimal, verbose
  mode: "standard"
  
  # Approval mode: manual, auto-approve, require-reason
  approval: "manual"
  
  # Session timeout in minutes (0 = no timeout)
  session-timeout: 0
  
  # Auto-save session state
  auto-save: true

audit:
  # Default audit profile
  profile: "default"
  
  # Dimensions to include: full, knowledge, architecture, traceability, implementation
  scope:
    - "full"
  
  # Minimum severity for reporting: critical, high, medium, low
  min-severity: "medium"
  
  # Enable detailed scoring
  detailed-scoring: true
  
  # Include recommendations in audit
  include-recommendations: true

reports:
  # Report location (relative to .kdse or absolute)
  location: "reports/"
  
  # Include timestamps in filenames
  timestamp: true
  
  # Generate summary reports
  summary: true
  
  # Generate detailed reports
  detailed: true
  
  # Auto-generate report after session
  auto-generate: true

logging:
  # Log verbosity: debug, info, warn, error
  verbosity: "info"
  
  # Log location
  location: "runtime/logs/"
  
  # Retain logs for N days (0 = forever)
  retention-days: 30
  
  # Enable structured logging
  structured: true

cache:
  # Enable artifact caching
  enabled: true
  
  # Cache location
  location: "cache/"
  
  # Maximum cache size in MB
  max-size: 100
  
  # Auto-clear cache on sync
  clear-on-sync: false

history:
  # Enable session history
  session-history: true
  
  # Enable audit history
  audit-history: true
  
  # Enable sync history
  sync-history: true
  
  # Retention days (0 = forever)
  retention-days: 0

notifications:
  # Enable session start notification
  session-start: false
  
  # Enable session end notification
  session-end: false
  
  # Enable approval request notification
  approval-required: true
